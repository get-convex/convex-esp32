sentence=ALPHA Convex client for the ESP32 (reactive queries, mutations, actions, HTTP actions).
paragraph=Speaks the Convex sync protocol over a TLS WebSocket: subscribe to reactive queries and get pushed updates with no polling, plus mutations, actions, and HTTP actions. Self-contained over WiFiClientSecure - no extra components. Alpha, no guarantee of support. Requires ArduinoJson and Arduino-ESP32 core 3.2+.
