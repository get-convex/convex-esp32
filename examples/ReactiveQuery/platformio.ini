; Build this example (and compile-check the library) with `pio run` from this
; directory. It uses the arduino + esp-idf combo so the esp_websocket_client
; component can be pulled in via custom_component_add.
[platformio]
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 115200

; The library under test (this repo) plus ArduinoJson.
lib_deps =
    symlink://../..
    bblanchon/ArduinoJson@^7.0.0

; esp_websocket_client is not in the Arduino closure; pull it as a component.
custom_component_add =
    espressif/esp_websocket_client@^1.2.0

build_flags = -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
