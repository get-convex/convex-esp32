; Build this example (and compile-check the library) with `pio run` from this
; directory. Self-contained: plain Arduino framework, only ArduinoJson needed.
[platformio]
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    symlink://../..
    bblanchon/ArduinoJson@^7.0.0

build_flags = -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
