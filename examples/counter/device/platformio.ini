; Convex ESP32 demo — ESP32-S3-Touch-LCD-1.54 (ST7789 240x240 + BOOT button).
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino, espidf

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16MB.csv

monitor_speed = 115200
lib_ldf_mode = deep+

lib_deps =
    https://github.com/get-convex/convex-esp32.git
    bblanchon/ArduinoJson@^7.0.0
    moononournation/GFX Library for Arduino@^1.4.9
    lewisxhe/SensorLib@^0.2.4

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -O2
